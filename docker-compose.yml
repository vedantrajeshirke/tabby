# Local mode: no accounts or external services. Ports are reachable from this computer only.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: snapspend
      POSTGRES_USER: snapspend
      POSTGRES_PASSWORD: snapspend
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapspend -d snapspend"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      PGHOST: db
      PGDATABASE: snapspend
      PGUSER: snapspend
      PGPASSWORD: snapspend
      AUTH_MODE: ${AUTH_MODE:-local}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      EXTRACTION_BACKEND: ${EXTRACTION_BACKEND:-local}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_SUPABASE_URL: ${SUPABASE_URL:-}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      VITE_AUTH_GOOGLE: ${AUTH_GOOGLE:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  db_data:
